[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-strategy-engine"
version = "0.2.2"
description = "Deterministic strategy generators and their fail-closed runtime consumer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "kairos-core>=0.3,<0.4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
runtime = ["kairos-persistence>=0.1,<0.2"]

[project.scripts]
kairos-strategy-engine = "kairos_strategy.service:main"

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
    "kairos-persistence>=0.1,<0.2",
]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.sources]
kairos-core = { git = "https://github.com/Kairos-cryptoAI/kairos-core.git", rev = "91cd95c8e5bd4393ed04606df08c205583092df7" }
kairos-persistence = { git = "https://github.com/Kairos-cryptoAI/kairos-persistence.git", rev = "d9d330c19713d681e2f29cbc8249578cdf8e95e3" }

[tool.hatch.build.targets.wheel]
packages = ["kairos_strategy"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
